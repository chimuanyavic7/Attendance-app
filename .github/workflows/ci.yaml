name: Attendance App

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write
  security-events: write

env:
  IMAGE_NAME: ${{ DOCKERHUB_USERNAME }}

jobs:

# ==================================================
# SECURITY - GITLEAKS
# ==================================================

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# ==================================================
# SEMANTIC VERSIONING
# ==================================================

  version:
    name: Semantic Version + Git SHA
    runs-on: ubuntu-latest
    needs: gitleaks

    outputs:
      version: ${{ steps.bump.outputs.version }}
      release: ${{ steps.bump.outputs.release }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Get latest version tag
        id: last_version
        run: |
          git fetch --tags

          LAST_TAG=$(git tag --sort=-v:refname | head -n 1)

          if [[ -z "$LAST_TAG" ]]; then
            LAST_TAG="v1.0.0"
          fi

          echo "last=$LAST_TAG" >> $GITHUB_OUTPUT


      - name: Get commit SHA
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT


      - name: Bump version
        id: bump
        run: |

          LAST=${{ steps.last_version.outputs.last }}
          VERSION=${LAST#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          COMMIT_MESSAGE=$(git log -1 --pretty=%B)

          RELEASE=false


          if [[ "$COMMIT_MESSAGE" == major:* ]]; then

            MAJOR=$((MAJOR+1))
            MINOR=0
            PATCH=0
            RELEASE=true


          elif [[ "$COMMIT_MESSAGE" == minor:* ]]; then

            MINOR=$((MINOR+1))
            PATCH=0
            RELEASE=true


          elif [[ "$COMMIT_MESSAGE" == patch:* ]]; then

            PATCH=$((PATCH+1))
            RELEASE=true
          fi


          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT


      - name: Create and push tag
        if: steps.bump.outputs.release == 'true'
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.bump.outputs.version }}
          git push origin ${{ steps.bump.outputs.version }}



# ==================================================
# DOCKER BUILD
# ==================================================

  docker:

    name: Build & Push Image

    runs-on: ubuntu-latest

    needs: version

    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}


    steps:

      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ DOCKERHUB_USERNAME }}
          password: ${{ DOCKERHUB_TOKEN }}


      - name: Build and Push Image
        uses: docker/build-push-action@v5

        with:

          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}/attendance-app:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}/attendance-app:${{ env.SHA }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true



# ==================================================
# HELM VALIDATION
# ==================================================

  validate:

    name: Validate Helm Chart

    runs-on: ubuntu-latest

    needs:
      - docker
      - version


    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4


      - name: Helm lint
        run: |
          helm lint helm/attendance-app-chart

      - name: Helm template test
        run: |

          helm template helm/attendance-app-chart \
            --set image.tag=${{ needs.version.outputs.version }}



# ==================================================
# IMAGE SECURITY SCAN
# ==================================================

  image-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs:
      - docker
      - version

    steps:

      - uses: actions/checkout@v4
      - name: Scan Version Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}/attendance-app:${{ needs.version.outputs.version }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH


      - name: Scan SHA Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}/attendance-app:${{ needs.version.outputs.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH



# ==================================================
# GITOPS UPDATE
# ==================================================

  gitops:

    name: Update Helm Values

    runs-on: ubuntu-latest

    needs:
      - validate
      - version
      - image-scan


    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        uses: mikefarah/yq@v4.44.3


      - name: Update Helm Image Tag
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          echo "Updating image tag to $VERSION"
          yq eval -i \
          ".image.tag = \"$VERSION\"" \
          helm/attendance-app-chart/values.yaml

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/attendance-app-chart/values.yaml
          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi
          git commit -m "deploy: ${{ needs.version.outputs.version }}"
          git push origin main