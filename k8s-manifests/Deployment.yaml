apiVersion: apps/v1 
kind: Deployment
metadata:
  name: attendance-app 
  labels:
    app: attendance-app 
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: attendance-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  

  template:
    metadata:
      labels:
        app: attendance-app
    spec:
      containers:
        - name: attendance-app-container 
          image: chimuanyavic7/attendance-app:v1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: db-secrets       
                
      


